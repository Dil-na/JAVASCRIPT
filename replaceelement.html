<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="box">
        <p id="old">old paragraph</p>
    </div>

    <script>
        let newE1 = document.createElement("p")
        newE1.innerText = "This is my new paragraph"

        let parent = document.getElementById("box")
        let oldE1 = document.getElementById("old")
        parent.replaceChild(newE1,oldE1)
    </script>

    <!-- replacewith -->

    <p id="old">old paragraph</p>
    <script>
        let newE1 = document.createElement("p")
        newE1.innerText = "This is my new para"
        // let oldE1 = document.getElementById('old')
        // oldE1.replacewith(newE1)
        document.getElementById("old").replaceWith(newE1)
    </script>
</body>
</html>
