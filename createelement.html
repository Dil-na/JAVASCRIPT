<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let p = document.createElement("p")
        // p.innerText = "New paragarph"
        // document.body.appendChild(p)
        document.body.append("new paraa")
    </script>
    <!-- appendChild- elemet/node only
    append = text/string = element -->

<!-- //inside a specific div  -->
    <div id ="box"></div>
    <script>
        let head = document.createElement('h2')
        head.innerText = "NEW HAEDING"
        document.getElementById('box').appendChild(head)
    </script>
<!-- 
    //prepend()-add at begining -->
    <p>element 1</p>

    <script>
        let e1 = document.createElement("p");
        e1.innerText = "First Element"
        document.body.prepend(e1)
    </script>

    <!-- //innerBefore()- insert before another element -->
    <ul id="list">
        <li>item 1</li>
    </ul>

    <script>
        let li = document.createElement("li")
        li.innerText = "New Item"

        let list = document.getElementById("list")
        list.insertBefore(li,list.firstChild)
    </script>
    </body>
</html>
