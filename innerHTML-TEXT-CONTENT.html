<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="data">
        <h2>Hello HTML</h2>
        <h2 style="display: none;">Hello CSS</h2>
        <h2>Hello JS</h2>
    </div>

    <script>
        // innerHTML
        let text =document.getElementById("data")
        console.log(text.innerHTML);
        text.innerHTML = "<u> welcome to js </u>"

        // innerText
        let text =document.getElementById("data")
        console.log(text.innerText);
        text.innerText = "<u> welcom to js </u>"
        console.log(text.innerText);

        //textcontent
        let text =document.getElementById("data")
        console.log(text.textContent);
        text.textContent = "<u> welcom to js </u>"
        console.log(text.textContent);
    </script>
</body>
</html>
